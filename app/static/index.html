<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232830'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f2a93b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      color-scheme: dark;
      --bg:        #1c2026;   /* graphite base */
      --rail:      #171a1f;   /* sidebar */
      --panel:     #232830;   /* device panel */
      --raised:    #2b313a;   /* buttons, hover rows */
      --line:      #343b45;   /* dividers */
      --text:      #e7e9ec;
      --muted:     #9aa3ad;
      --faint:     #6b7480;
      --amber:     #f2a93b;   /* power LED: wake actions */
      --amber-ink: #241703;
      --green:     #4cc38a;   /* online */
      --red:       #ef6b6b;   /* errors */

      --radius-lg: 12px;
      --radius-sm: 6px;
      --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg:     #eef0f2;
        --rail:   #e4e7ea;
        --panel:  #ffffff;
        --raised: #f3f5f7;
        --line:   #d9dde2;
        --text:   #1b1f24;
        --muted:  #5d6670;
        --faint:  #8a929b;
        --amber:  #b86f05;
        --amber-ink: #ffffff;
        --green:  #1f8f5a;
        --red:    #c93c3c;
      }
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, p { margin: 0; }

    :focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ---------- Shell: sidebar + main ---------- */
    .shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 32px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: grid; place-items: center;
      flex: none;
    }
    .brand-mark span {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 60%, transparent);
    }

    .nav { display: flex; flex-direction: column; gap: 2px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-item svg { width: 18px; height: 18px; flex: none; }
    .nav-item.is-active { background: var(--panel); color: var(--text); }
    .nav-item.is-active svg { color: var(--amber); }
    .nav-item.is-disabled { color: var(--faint); cursor: default; }

    .tag {
      margin-left: auto;
      font-size: 12px;
      font-weight: 500;
      color: var(--faint);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 6px;
      line-height: 20px;
    }

    .server-status {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------- Main ---------- */
    .main {
      padding: 48px 56px 64px;
      max-width: 960px;
      width: 100%;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .lede { margin-top: 6px; color: var(--muted); }

    .count {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Device panel: one panel, rack-unit rows ---------- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .unit {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 20px 24px;
    }
    .unit + .unit { border-top: 1px solid var(--line); }

    .unit-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .unit-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      margin: 4px 0 0;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .unit-meta div { display: flex; gap: 6px; }
    .unit-meta dt { color: var(--faint); }
    .unit-meta dd { margin: 0; color: var(--muted); }

    .unit-status {
      margin-top: 8px;
      font-size: 13px;
      color: var(--faint);
    }
    .unit-status.is-sent  { color: var(--amber); }
    .unit-status.is-error { color: var(--red); }

    /* Status LED */
    .led {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--faint);
      flex: none;
      align-self: start;
      margin-top: 8px;
    }
    .server-status .led { margin-top: 0; align-self: center; }
    .led[data-state="online"]  { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 55%, transparent); }
    .led[data-state="sent"]    { background: var(--amber); box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 55%, transparent); }
    .led[data-state="sending"] { background: var(--amber); animation: blink .5s steps(2, jump-none) infinite; }
    .led[data-state="error"]   { background: var(--red); }

    @keyframes blink { 50% { opacity: .2; } }

    /* Power button: the one bold element */
    .power {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px 6px 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .power-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--amber);
      color: var(--amber-ink);
    }
    .power-icon svg { width: 18px; height: 18px; }
    .power:hover {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 16%, transparent);
    }
    .power:active { transform: translateY(1px); }
    .power:disabled { cursor: progress; opacity: .7; }
    .power:focus-visible { border-radius: 999px; }

    /* Empty, loading and error states */
    .state {
      padding: 40px 24px;
      text-align: center;
      color: var(--muted);
    }
    .state strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .state code {
      font-size: 13px;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1px 6px;
    }
    .state.is-error strong { color: var(--red); }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: var(--faint);
    }
    .hint code { font-size: 12px; color: var(--muted); }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ---------- Small screens: sidebar becomes a top bar ---------- */
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 16px;
        padding: 14px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .brand { padding: 0; }
      .server-status { margin: 0 0 0 auto; padding: 0; }
      .nav {
        flex-direction: row;
        width: 100%;
        overflow-x: auto;
        gap: 4px;
      }
      .nav-item { white-space: nowrap; padding: 7px 10px; }
      .tag { margin-left: 4px; }

      .main { padding: 28px 16px 48px; }
      h1 { font-size: 24px; }
      .page-head { align-items: flex-start; flex-direction: column; gap: 8px; }
      .unit { padding: 18px 16px; gap: 14px; }
    }

    @media (max-width: 420px) {
      .power { padding: 5px; }
      .power-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .led[data-state="sending"] { animation: none; opacity: .6; }
      .power { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        Home Dashboard
      </div>

      <nav class="nav" aria-label="Sections">
        <a class="nav-item is-active" href="#devices" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          Devices
        </a>
        <span class="nav-item is-disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          Uptime
          <span class="tag">Soon</span>
        </span>
        <span class="nav-item is-disabled" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          System stats
          <span class="tag">Soon</span>
        </span>
      </nav>

      <div class="server-status" id="server-status">
        <span class="led" aria-hidden="true"></span>
        <span id="server-text">Checking server…</span>
      </div>
    </aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>Devices</h1>
          <p class="lede">Send a wake signal to machines on your network.</p>
        </div>
        <p class="count" id="count"></p>
      </header>

      <section class="panel" id="devices" aria-label="Devices">
        <div class="state">Loading devices…</div>
      </section>

      <p class="hint">Devices come from <code>config/config.json</code>. Edit that file and refresh to update this list.</p>

      <div class="visually-hidden" aria-live="polite" id="announcer"></div>
    </main>
  </div>

  <script>
    const panel = document.getElementById("devices");
    const count = document.getElementById("count");
    const announcer = document.getElementById("announcer");

    const POWER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>`;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function showState(title, body, isError = false) {
      panel.replaceChildren();
      const box = el("div", "state" + (isError ? " is-error" : ""));
      box.append(el("strong", null, title));
      const p = el("p");
      p.innerHTML = body;   // body is static copy written below, never server data
      box.append(p);
      panel.append(box);
    }

    function deviceRow(device) {
      const row = el("article", "unit");

      const led = el("span", "led");
      led.dataset.state = "idle";
      led.setAttribute("aria-hidden", "true");

      const body = el("div", "unit-body");
      body.append(el("h2", "unit-name", device.name));

      const meta = el("dl", "unit-meta");
      for (const [label, value] of [["IP", device.ip], ["MAC", device.mac]]) {
        if (!value) continue;
        const pair = el("div");
        pair.append(el("dt", null, label), el("dd", null, value));
        meta.append(pair);
      }
      body.append(meta);

      const status = el("p", "unit-status", "Power status isn’t tracked yet");
      body.append(status);

      const btn = el("button", "power");
      btn.type = "button";
      btn.setAttribute("aria-label", `Wake ${device.name}`);
      btn.innerHTML = `<span class="power-icon">${POWER_ICON}</span>`;
      btn.append(el("span", "power-label", "Wake"));
      btn.addEventListener("click", () => wake(device, btn, led, status));

      row.append(led, body, btn);
      return row;
    }

    async function wake(device, btn, led, status) {
      btn.disabled = true;
      led.dataset.state = "sending";
      status.className = "unit-status";
      status.textContent = "Sending wake signal…";

      try {
        const res = await fetch(`/api/wake/${encodeURIComponent(device.id)}`, { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || `Server responded with ${res.status}`);

        led.dataset.state = "sent";
        status.className = "unit-status is-sent";
        status.textContent = `Wake signal sent at ${timeNow()}. It can take a minute to boot.`;
        announcer.textContent = `Wake signal sent to ${device.name}`;
      } catch (e) {
        led.dataset.state = "error";
        status.className = "unit-status is-error";
        status.textContent = `Wake signal not sent: ${e.message}`;
        announcer.textContent = `Wake signal not sent to ${device.name}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadDevices() {
      try {
        const res = await fetch("/api/devices");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || `Server responded with ${res.status}`);

        count.textContent = data.length === 1 ? "1 device" : `${data.length} devices`;

        if (data.length === 0) {
          showState(
            "No devices yet",
            "Add a device to <code>config/config.json</code>, then refresh this page."
          );
          return;
        }

        panel.replaceChildren(...data.map(deviceRow));
      } catch (e) {
        count.textContent = "";
        showState("Devices couldn’t load", "", true);
        panel.querySelector("p").textContent = e.message;
      }
    }

    async function checkServer() {
      const led = document.querySelector("#server-status .led");
      const text = document.getElementById("server-text");
      try {
        const res = await fetch("/api/health", { cache: "no-store" });
        if (!res.ok) throw new Error();
        led.dataset.state = "online";
        text.textContent = "Server online";
      } catch {
        led.dataset.state = "error";
        text.textContent = "Server unreachable";
      }
    }

    loadDevices();
    checkServer();
    setInterval(checkServer, 30000);
  </script>
</body>
</html>
